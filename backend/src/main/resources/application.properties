spring.application.name=realista

## DB CONFIG (supports both local and production via env vars)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/realistadb}
spring.datasource.username=${DATABASE_USER:realistaDmin}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Show SQL queries
spring.jpa.show-sql=true
# Format them nicely (optional but recommended)
spring.jpa.properties.hibernate.format_sql=true
# Show the actual parameter values (optional)
logging.level.org.hibernate.orm.jdbc.bind=trace

logging.level.com.realista=DEBUG

## CORS CONFIG
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

## JWT CONFIG
jwt.secret=${JWT_SECRET:RealIstA-2026-S3cur3-JWT-T0ken-S1gn1ng-K3y-Ch4ng3-1n-Pr0duct10n}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}